<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SwapIt — Gallery · FR-15</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0a;font-family:'DM Sans',sans-serif;color:#fff;min-height:100vh}
.lb-header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1)}
.lb-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.lb-count{font-size:13px;color:rgba(255,255,255,.5)}
.lb-close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-close:hover{background:rgba(255,255,255,.2)}
.main-view{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:80px 60px 120px;position:relative}
.main-img{max-width:800px;width:100%;height:500px;background:linear-gradient(135deg,#1a2a1a,#2a4a2a);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:120px;border:1px solid rgba(255,255,255,.1)}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:50%;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.nav-arrow:hover{background:rgba(255,255,255,.25)}
.nav-prev{left:16px}.nav-next{right:16px}
.thumbs-strip{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);padding:14px 24px;display:flex;gap:10px;justify-content:center;overflow-x:auto;border-top:1px solid rgba(255,255,255,.1)}
.thumb{width:64px;height:64px;border-radius:8px;background:linear-gradient(135deg,#1a2a1a,#2a4a2a);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;transition:.2s;flex-shrink:0}
.thumb.on{border-color:#B7E4C7}
.thumb:hover{border-color:rgba(183,228,199,.5)}
.img-info{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:8px 18px;border-radius:99px;font-size:13px;color:rgba(255,255,255,.7)}
</style></head>
<body>
<div class="lb-header">
  <a href="FR-14-listing-detail.html" style="display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:14px">← Back to Listing</a>
  <div class="lb-title">iPhone 14 Pro · 256GB Space Black</div>
  <div style="display:flex;align-items:center;gap:10px"><span class="lb-count" id="countTxt">Image 1 of 6</span><button class="lb-close" onclick="window.location='FR-14-listing-detail.html'">✕</button></div>
</div>
<div class="main-view">
  <button class="nav-arrow nav-prev" onclick="nav(-1)">‹</button>
  <div class="main-img" id="mainImg">📱</div>
  <button class="nav-arrow nav-next" onclick="nav(1)">›</button>
  <div class="img-info">📱 Front view</div>
</div>
<div class="thumbs-strip">
  <div class="thumb on" onclick="go(0)">📱</div>
  <div class="thumb" onclick="go(1)">🔍</div>
  <div class="thumb" onclick="go(2)">📦</div>
  <div class="thumb" onclick="go(3)">🔋</div>
  <div class="thumb" onclick="go(4)">⚙️</div>
  <div class="thumb" onclick="go(5)">🖼️</div>
</div>
<script>
const imgs=['📱','🔍','📦','🔋','⚙️','🖼️'];const captions=['Front view','Camera detail','Original box','Battery & settings','Settings screen','Side view'];
let cur=0;
function go(i){cur=i;document.querySelectorAll('.thumb').forEach((t,j)=>t.classList.toggle('on',j===i));document.getElementById('mainImg').textContent=imgs[i];document.getElementById('countTxt').textContent='Image '+(i+1)+' of '+imgs.length;document.querySelector('.img-info').textContent='📱 '+captions[i]}
function nav(d){go((cur+d+imgs.length)%imgs.length)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1);if(e.key==='Escape')window.location='FR-14-listing-detail.html'})
</script></body></html>
